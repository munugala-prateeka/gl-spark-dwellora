spring.application.name=AMENITY-SERVICE

server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/dwellora_amenity
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:your_local_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Server Config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.datasource.hikari.pool-name=AmenityServiceHikariPool
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1