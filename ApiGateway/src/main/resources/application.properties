spring.application.name=API-GATEWAY
server.port=8769

# Eureka Server URL
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

# Register with Eureka
eureka.client.register-with-eureka=true

# Fetch Registry from Eureka
eureka.client.fetch-registry=true

# Register using IP Address
eureka.instance.prefer-ip-address=true

# Unique Instance ID
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Updated CORS Configuration
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*

# Updated Discovery Locator
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Onboarding Service
spring.cloud.gateway.server.webflux.routes[0].id=onboarding-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ONBOARDING-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/onboarding/**

# Apartment Service
spring.cloud.gateway.server.webflux.routes[1].id=apartment-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://APARTMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/apartments/**

# User Service
spring.cloud.gateway.server.webflux.routes[2].id=user-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/users/**

# Amenity Service
spring.cloud.gateway.server.webflux.routes[3].id=amenity-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://AMENITY-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/amenities/**

# Booking Service
spring.cloud.gateway.server.webflux.routes[4].id=booking-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/bookings/**

# Notification Service
spring.cloud.gateway.server.webflux.routes[5].id=notification-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/notifications/**

# Maintenance Service
spring.cloud.gateway.server.webflux.routes[6].id=maintenance-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://MAINTENANCE-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/complaints/**

# Notice Service
spring.cloud.gateway.server.webflux.routes[7].id=notice-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://NOTICE-SERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/notices/**

# Event Service
spring.cloud.gateway.server.webflux.routes[8].id=event-service
spring.cloud.gateway.server.webflux.routes[8].uri=lb://EVENT-SERVICE
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/events/**


