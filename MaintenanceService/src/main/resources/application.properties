spring.application.name=MAINTENANCE-SERVICE

server.port=8088
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dwellora_maintenance}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:your_local_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Eureka Server URL
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=localhost

# Register with Eureka
eureka.client.register-with-eureka=true

# Fetch Registry from Eureka
eureka.client.fetch-registry=true

# Register using IP Address
eureka.instance.prefer-ip-address=false

# Unique Instance ID
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.datasource.hikari.pool-name=MaintenanceServiceHikariPool
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1